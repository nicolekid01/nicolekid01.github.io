<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>갯벌 생물 탐험대! 🔍</title>
    <!-- 3학년 아이들에게 어울리는 귀여운 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* 마우스 위치 변수 (기본값 화면 밖) */
            --mouse-x: -999px;
            --mouse-y: -999px;
            --lens-size: 60px; /* 돋보기 렌즈 반지름 */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Jua', sans-serif;
            cursor: none; /* 기본 커서 완벽히 숨김 */
            user-select: none;
            background-color: #000;
        }

        /* --- 1. 배경 레이어 --- */
        #background {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        /* 하늘 (위쪽 40%) */
        .sky {
            height: 40%;
            background: linear-gradient(to bottom, #6db5fb 0%, #b9e0ff 60%, #f2fbff 100%);
            position: relative;
            overflow: hidden;
        }

        /* 해 */
        .sun {
            position: absolute;
            right: 8%;
            top: 12%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #fffbe0 0%, #ffe680 55%, #ffd447 100%);
            box-shadow: 0 0 40px 14px rgba(255, 233, 140, 0.65), 0 0 120px 50px rgba(255, 240, 170, 0.35);
            animation: sun-glow 3s ease-in-out infinite alternate;
        }
        @keyframes sun-glow {
            from { transform: scale(1); }
            to   { transform: scale(1.06); }
        }

        /* 구름 (천천히 흘러감) */
        .cloud {
            position: absolute;
            left: 0;
            width: var(--w);
            height: calc(var(--w) * 0.3);
            background: #fff;
            border-radius: 999px;
            opacity: 0.92;
            filter: drop-shadow(0 4px 6px rgba(80, 120, 170, 0.18));
            z-index: 1;
            animation: drift var(--dur) linear infinite;
            animation-delay: var(--delay);
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud::before { width: 45%; height: 160%; left: 15%; bottom: 35%; }
        .cloud::after  { width: 35%; height: 120%; left: 50%; bottom: 30%; }
        @keyframes drift {
            from { transform: translateX(-30vw); }
            to   { transform: translateX(110vw); }
        }

        /* 멀리 나는 새 */
        .bird {
            position: absolute;
            left: 0;
            width: 26px;
            animation: bird-fly var(--dur) linear infinite;
            animation-delay: var(--delay);
        }
        .bird svg { width: 100%; animation: flap 0.6s ease-in-out infinite alternate; transform-origin: center; }
        @keyframes bird-fly {
            from { transform: translate(-5vw, 0); }
            50%  { transform: translate(50vw, -12px); }
            to   { transform: translate(105vw, 4px); }
        }
        @keyframes flap {
            from { transform: scaleY(1); }
            to   { transform: scaleY(0.45); }
        }

        /* 수평선 산 */
        .mountains {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 70px;
        }

        /* 갯벌 (아래쪽 60%) */
        .mudflat {
            height: 60%;
            background: linear-gradient(to bottom,
                #d2c9b3 0%,
                #c6b99e 18%,
                #b9a98c 50%,
                #ad9c7f 100%);
            position: relative;
            overflow: hidden;
        }

        /* 갯벌 흙 물결무늬 */
        .mudflat::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse at center, rgba(70, 50, 30, 0.10) 0%, transparent 45%),
                radial-gradient(ellipse at center, rgba(255, 255, 255, 0.10) 0%, transparent 45%);
            background-size: 64px 18px, 90px 26px;
            background-position: 0 0, 32px 10px;
        }

        /* 수평선 쪽 바닷물 띠 */
        .sea {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 9%;
            background: linear-gradient(to bottom, #8fcbe8 0%, #b9e0ef 55%, rgba(185, 224, 239, 0) 100%);
            overflow: hidden;
        }
        .sea::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg,
                rgba(255, 255, 255, 0) 0px,
                rgba(255, 255, 255, 0.55) 25px,
                rgba(255, 255, 255, 0) 50px,
                rgba(255, 255, 255, 0) 130px);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 60%);
            mask-image: linear-gradient(to bottom, black 0%, transparent 60%);
            opacity: 0.45;
            animation: sea-shimmer 6s linear infinite;
        }
        @keyframes sea-shimmer {
            from { background-position: 0 0; }
            to   { background-position: 260px 0; }
        }

        /* 갯골·물웅덩이 그림 */
        .mud-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .shimmer { animation: shimmer 3.5s ease-in-out infinite alternate; }
        .shimmer.slow { animation-duration: 5s; }
        @keyframes shimmer {
            from { opacity: 0.35; }
            to   { opacity: 0.85; }
        }

        /* 게 구멍과 작은 조개껍데기·돌 */
        .hole {
            position: absolute;
            width: 9px;
            height: 5px;
            border-radius: 50%;
            background: radial-gradient(ellipse, #3f3121 30%, #5f4b35 100%);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .pebble {
            position: absolute;
            width: 6px;
            height: 4px;
            border-radius: 50%;
            background: #efe6d4;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
            opacity: 0.85;
        }

        /* --- 2. 발견된 생물 레이어 (계속 보임) --- */
        #found-creatures-layer {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none; /* 이모지 자체는 클릭 방해 안 함 */
        }

        .found-emoji {
            position: absolute;
            font-size: 3.5rem;
            transform: translate(-50%, -50%) scale(0);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .found-emoji.show {
            transform: translate(-50%, -50%) scale(1);
        }

        /* 추가된 이미지 요소 스타일 */
        .found-image-element {
            width: 80px;
            height: 80px;
            object-fit: contain; /* 원본 비율 유지 */
            background: transparent; /* 배경 투명하게 */
            border: none; /* 테두리 제거 */
            border-radius: 0;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        /* 모달 속 실물 사진 */
        .modal-photo {
            display: block;
            width: 100%;
            height: 280px;
            object-fit: contain; /* 사진이 잘리지 않고 전체가 보이게 */
            background: #ecfeff;
            border-radius: 1.5rem;
            border: 4px solid #a5f3fc;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        /* 문장을 한 줄씩 나눈 목록 */
        .sentence-list { list-style: none; margin: 0; padding-left: 0.5rem; }
        .sentence-list li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.3rem;
            color: #374151;
            word-break: keep-all;
        }
        .sentence-list li::before {
            content: '-';
            position: absolute;
            left: 0;
            color: #0e7490;
        }
        .photo-wrap { position: relative; margin-bottom: 1rem; }
        .photo-badge {
            position: absolute;
            left: 12px;
            bottom: 12px;
            background: rgba(255,255,255,0.92);
            color: #155e75;
            font-size: 1rem;
            padding: 4px 12px;
            border-radius: 9999px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }
        .photo-emoji {
            position: absolute;
            right: 10px;
            bottom: 6px;
            font-size: 3rem;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* --- 3. 인터랙션 (클릭 영역) 레이어 --- */
        #interaction-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
        }

        .hitbox {
            position: absolute;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            cursor: none;
        }

        /* --- 4. 돋보기 밖을 살짝 어둡게 (렌즈 안은 밝게) --- */
        #dim-layer {
            position: absolute;
            inset: 0;
            z-index: 15;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.06);
            -webkit-mask-image: radial-gradient(circle calc(var(--lens-size) + 10px) at var(--mouse-x) var(--mouse-y), transparent 99%, black 100%);
            mask-image: radial-gradient(circle calc(var(--lens-size) + 10px) at var(--mouse-x) var(--mouse-y), transparent 99%, black 100%);
        }

        /* --- 돋보기를 통해서만 보이는 반짝이 레이어 --- */
        #masked-sparkle-layer {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle var(--lens-size) at var(--mouse-x) var(--mouse-y), black 99%, transparent 100%);
            mask-image: radial-gradient(circle var(--lens-size) at var(--mouse-x) var(--mouse-y), black 99%, transparent 100%);
        }

        .sparkle {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #FFF176;
            text-shadow: 0 0 15px #FFEB3B, 0 0 30px #FFC107;
            animation: pulse-spin 1s infinite alternate;
        }

        @keyframes pulse-spin {
            0% { transform: translate(-50%, -50%) scale(0.8) rotate(-15deg); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(15deg); opacity: 1; }
        }

        /* --- 5. 커스텀 돋보기 커서 --- */
        /* 렌즈 안쪽 지름 = 반짝이가 보이는 원과 똑같이 맞춤 */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            box-sizing: content-box;
            width: calc(var(--lens-size) * 2);
            height: calc(var(--lens-size) * 2);
            border-radius: 50%;
            border: 10px solid #374151; /* 검은 테 */
            box-shadow:
                0 0 0 3px #cbd5e1,               /* 바깥 은색 테 */
                inset 0 0 0 2px #9ca3af,         /* 안쪽 은색 테 */
                inset 0 0 18px rgba(0,0,0,0.25), /* 렌즈 가장자리 그늘 */
                6px 8px 14px rgba(0,0,0,0.35);   /* 돋보기 그림자 */
            /* 유리 반사광 */
            background:
                radial-gradient(ellipse 45% 30% at 32% 24%, rgba(255,255,255,0.45), rgba(255,255,255,0) 70%),
                rgba(255, 255, 255, 0.06);
            backdrop-filter: brightness(1.15) contrast(1.05);
            pointer-events: none;
            z-index: 100;
            transform: translate(calc(var(--mouse-x) - var(--lens-size) - 10px), calc(var(--mouse-y) - var(--lens-size) - 10px));
            will-change: transform;
        }

        /* 손잡이와 테를 잇는 금속 고리 */
        #custom-cursor::before,
        #custom-cursor::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: top center;
            pointer-events: none;
        }
        #custom-cursor::before {
            width: 26px;
            height: 22px;
            margin-left: -13px;
            background: linear-gradient(90deg, #6b7280, #e5e7eb 50%, #6b7280);
            border-radius: 4px;
            transform: rotate(-45deg) translateY(calc(var(--lens-size) + 10px));
            z-index: 1;
        }

        /* 나무 손잡이 (렌즈 오른쪽 아래로 똑바로 이어짐) */
        #custom-cursor::after {
            width: 30px;
            height: 95px;
            margin-left: -15px;
            background: linear-gradient(90deg, #78350f 0%, #c2410c 45%, #9a3412 70%, #78350f 100%);
            border: 2px solid #451a03;
            border-radius: 6px 6px 16px 16px;
            box-shadow: 4px 6px 10px rgba(0,0,0,0.4);
            transform: rotate(-45deg) translateY(calc(var(--lens-size) + 30px));
        }

        /* --- UI 및 모달 --- */
        .title-shadow {
            text-shadow: 3px 3px 0 #1d4ed8, -1px -1px 0 #1e3a8a, 2px -2px 0 #1e3a8a, -2px 2px 0 #1e3a8a;
        }
        
        .desc-shadow {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .modal-enter {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.6) translateY(50px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- 1. 배경 레이어 -->
    <div id="background">
        <div class="sky">
            <!-- 안내 텍스트 (하늘 쪽에 배치) -->
            <div class="absolute top-6 left-0 w-full text-center pointer-events-none z-30">
                <h1 class="text-4xl md:text-6xl text-white font-bold title-shadow tracking-wide mb-3">
                    갯벌 생물 탐험대! 
                </h1>
                <p class="text-xl md:text-2xl text-yellow-300 desc-shadow font-bold bg-black/30 inline-block px-6 py-2 rounded-full backdrop-blur-sm">
                    돋보기로 갯벌을 살펴보고 반짝이(✨)를 클릭해봐요!
                </p>
            </div>
            <div class="sun"></div>
            <div class="cloud" style="--w:150px; top:18%; --dur:90s; --delay:-20s;"></div>
            <div class="cloud" style="--w:100px; top:42%; --dur:70s; --delay:-55s;"></div>
            <div class="cloud" style="--w:190px; top:8%;  --dur:120s; --delay:-85s;"></div>
            <div class="cloud" style="--w:80px;  top:55%; --dur:60s; --delay:-5s;"></div>

            <div class="bird" style="top:30%; --dur:40s; --delay:-10s;">
                <svg viewBox="0 0 20 8"><path d="M0 6 Q5 0 10 6 Q15 0 20 6" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <div class="bird" style="top:36%; width:18px; --dur:46s; --delay:-12s;">
                <svg viewBox="0 0 20 8"><path d="M0 6 Q5 0 10 6 Q15 0 20 6" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/></svg>
            </div>

            <!-- 수평선 산 (먼 산은 흐리게, 가까운 산은 진하게) -->
            <svg class="mountains" viewBox="0 0 1000 70" preserveAspectRatio="none">
                <path d="M0 70 L0 38 Q80 10 170 32 Q240 46 310 22 Q400 0 480 30 Q560 52 640 26 Q730 4 820 30 Q900 48 1000 24 L1000 70 Z" fill="#9db7c9" opacity="0.8"/>
                <path d="M0 70 L0 52 Q120 30 230 50 Q330 64 430 44 Q520 28 610 50 Q720 70 830 48 Q920 34 1000 50 L1000 70 Z" fill="#6f8f8a"/>
            </svg>
        </div>
        <div class="mudflat">
            <div class="sea"></div>

            <!-- 갯골(물길)과 물웅덩이 -->
            <svg class="mud-art" viewBox="0 0 1000 600" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#dff3fb"/>
                        <stop offset="1" stop-color="#9fcfe3"/>
                    </linearGradient>
                </defs>

                <!-- 큰 갯골 -->
                <path d="M610 10 C590 120 700 170 660 250 C620 330 520 340 540 430 C555 500 640 540 620 600"
                      fill="none" stroke="#9a8768" stroke-width="48" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.6"/>
                <path d="M610 10 C590 120 700 170 660 250 C620 330 520 340 540 430 C555 500 640 540 620 600"
                      fill="none" stroke="url(#water)" stroke-width="32" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.85"/>
                <path class="shimmer" d="M610 10 C590 120 700 170 660 250 C620 330 520 340 540 430 C555 500 640 540 620 600"
                      fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="24 46" stroke-linecap="round" vector-effect="non-scaling-stroke"/>

                <!-- 작은 갯골 -->
                <path d="M170 15 C200 110 120 160 160 230 C190 280 280 300 260 380"
                      fill="none" stroke="#9a8768" stroke-width="30" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.55"/>
                <path d="M170 15 C200 110 120 160 160 230 C190 280 280 300 260 380"
                      fill="none" stroke="url(#water)" stroke-width="18" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.8"/>
                <path d="M660 250 C740 270 800 240 880 280 C930 305 960 290 1000 300"
                      fill="none" stroke="url(#water)" stroke-width="12" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity="0.7"/>

                <!-- 물웅덩이 -->
                <ellipse cx="330" cy="140" rx="70" ry="14" fill="url(#water)" opacity="0.7"/>
                <ellipse class="shimmer" cx="318" cy="136" rx="30" ry="4" fill="#fff"/>
                <ellipse cx="820" cy="420" rx="95" ry="18" fill="url(#water)" opacity="0.65"/>
                <ellipse class="shimmer slow" cx="805" cy="414" rx="40" ry="5" fill="#fff"/>
                <ellipse cx="420" cy="530" rx="80" ry="15" fill="url(#water)" opacity="0.7"/>
                <ellipse class="shimmer" cx="410" cy="525" rx="32" ry="4" fill="#fff"/>
                <ellipse cx="90" cy="470" rx="55" ry="11" fill="url(#water)" opacity="0.6"/>

                <!-- 물 빠진 자국 (얇은 물결선) -->
                <g fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.28" vector-effect="non-scaling-stroke">
                    <path d="M20 110 q30 -8 60 0 t60 0 t60 0" vector-effect="non-scaling-stroke"/>
                    <path d="M740 120 q30 -8 60 0 t60 0 t60 0 t60 0" vector-effect="non-scaling-stroke"/>
                    <path d="M300 250 q25 -7 50 0 t50 0 t50 0" vector-effect="non-scaling-stroke"/>
                    <path d="M40 330 q25 -7 50 0 t50 0" vector-effect="non-scaling-stroke"/>
                    <path d="M760 520 q25 -7 50 0 t50 0 t50 0" vector-effect="non-scaling-stroke"/>
                    <path d="M200 570 q25 -7 50 0 t50 0" vector-effect="non-scaling-stroke"/>
                </g>
            </svg>

            <div id="mud-dots"></div>
        </div>
    </div>

    <!-- 2. 발견된 생물이 표시되는 레이어 (돋보기 밖에서도 보임) -->
    <div id="found-creatures-layer"></div>

    <!-- 3. 클릭을 감지하는 투명 레이어 -->
    <div id="interaction-layer"></div>

    <!-- 4. 돋보기 밖 어둡게 -->
    <div id="dim-layer"></div>

    <!-- 반짝이 레이어 (돋보기 마스크 적용됨) -->
    <div id="masked-sparkle-layer"></div>

    <!-- 5. 돋보기 커서 -->
    <div id="custom-cursor"></div>

    <!-- 6. 생물 정보 팝업 모달 -->
    <div id="info-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex-col items-center justify-center z-[200] cursor-default">
        <div class="bg-white rounded-[2.5rem] p-6 max-w-lg w-[90%] max-h-[94vh] overflow-y-auto text-center shadow-2xl relative border-8 border-cyan-400 modal-enter">
            <!-- 닫기 버튼 -->
            <button id="close-modal-btn" class="absolute -top-6 -right-6 bg-red-500 hover:bg-red-600 text-white rounded-full w-14 h-14 text-3xl flex items-center justify-center shadow-lg border-4 border-white transition-transform hover:scale-110 cursor-pointer">
                ✖
            </button>
            
            <div class="photo-wrap">
                <img id="modal-photo" class="modal-photo" src="" alt="">
                <span class="photo-badge">📷 실제 모습</span>
                <span id="modal-emoji" class="photo-emoji"></span>
            </div>
            
            <h2 id="modal-name" class="text-4xl text-cyan-800 font-bold mb-4 border-b-4 border-cyan-200 pb-2 inline-block"></h2>
            
            <div class="text-left space-y-5 text-gray-800 text-xl leading-relaxed bg-cyan-50 p-6 rounded-3xl border border-cyan-100 shadow-inner">
                <div>
                    <span class="inline-flex items-center bg-blue-100 text-blue-900 px-4 py-1.5 rounded-full text-lg mb-2 font-bold shadow-sm">
                        👀 생김새
                    </span>
                    <ul id="modal-appearance" class="sentence-list"></ul>
                </div>
                <div>
                    <span id="diet-label" class="inline-flex items-center bg-green-100 text-green-900 px-4 py-1.5 rounded-full text-lg mb-2 font-bold shadow-sm">
                        🍽️ 먹이
                    </span>
                    <ul id="modal-diet" class="sentence-list"></ul>
                </div>
                <div id="extra-box" class="hidden">
                    <span class="inline-flex items-center bg-amber-100 text-amber-900 px-4 py-1.5 rounded-full text-lg mb-2 font-bold shadow-sm">
                        ⭐ 더 알아보기
                    </span>
                    <ul id="modal-extra" class="sentence-list"></ul>
                </div>
            </div>
        </div>

        (function scatterMudDots() {
            const box = document.getElementById('mud-dots');
            let seed = 7;
            const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
            for (let i = 0; i < 70; i++) {
                const d = document.createElement('div');
                d.className = i % 3 === 0 ? 'pebble' : 'hole';
                d.style.left = (rand() * 98) + '%';
                d.style.top = (12 + rand() * 86) + '%';
                const s = 0.7 + rand() * 0.8;
                d.style.transform = `scale(${s.toFixed(2)})`;
                box.appendChild(d);
            }
        })();

        const interactionLayer = document.getElementById('interaction-layer');
        const maskedSparkleLayer = document.getElementById('masked-sparkle-layer');
        const foundCreaturesLayer = document.getElementById('found-creatures-layer');
        const modal = document.getElementById('info-modal');
        const customCursor = document.getElementById('custom-cursor');
        
        let currentOpenOrganismId = null;

        // 초기 생물 배치 설정
        organisms.forEach(org => {
            // 1. 투명 클릭 영역 생성
            const hitbox = document.createElement('div');
            hitbox.className = 'hitbox';
            hitbox.style.top = org.position.top;
            hitbox.style.left = org.position.left;
            
            // 모달 열기 이벤트
            const openAction = (e) => {
                e.preventDefault();
                showModal(org);
            };
            hitbox.addEventListener('click', openAction);
            hitbox.addEventListener('touchstart', openAction, {passive: false});
            interactionLayer.appendChild(hitbox);

            // 2. 마스크 안에서 빛나는 반짝이 생성
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.id = `sparkle-${org.id}`;
            sparkle.style.top = org.position.top;
            sparkle.style.left = org.position.left;
            sparkle.innerText = "✨";
            maskedSparkleLayer.appendChild(sparkle);

            // 3. 발견 후 표시될 이모지 또는 사진 (초기엔 숨김/크기0 상태)
            const foundCreature = document.createElement('div');
            foundCreature.className = 'found-emoji';
            foundCreature.id = `found-emoji-${org.id}`;
            foundCreature.style.top = org.position.top;
            foundCreature.style.left = org.position.left;
            
            foundCreature.innerText = org.emoji;
            foundCreaturesLayer.appendChild(foundCreature);
        });

        // 마우스 및 터치 좌표에 따라 돋보기와 마스크 이동
        function updateCursor(x, y) {
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        }

        document.addEventListener('mousemove', (e) => {
            updateCursor(e.clientX, e.clientY);
        });

        // 모바일 터치 지원
        document.addEventListener('touchmove', (e) => {
            if(modal.classList.contains('hidden')) {
                updateCursor(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: true});

        document.addEventListener('touchstart', (e) => {
            if(modal.classList.contains('hidden')) {
                updateCursor(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: true});

        // 문장을 하나씩 나눠서 '-' 목록으로 보여주기
        function fillSentences(id, text) {
            const list = document.getElementById(id);
            list.innerHTML = '';
            text.split(/(?<=[.!?])\s+/).forEach(s => {
                if (!s.trim()) return;
                const li = document.createElement('li');
                li.textContent = s.trim();
                list.appendChild(li);
            });
        }

        // 모달 열기
        function showModal(organism) {
            currentOpenOrganismId = organism.id;
            
            const photo = document.getElementById('modal-photo');
            photo.src = organism.photo;
            photo.alt = organism.name + ' 실물 사진';
            document.getElementById('modal-emoji').textContent = organism.emoji;
            
            document.getElementById('modal-name').textContent = organism.name;
            fillSentences('modal-appearance', organism.appearance);
            fillSentences('modal-diet', organism.diet);
            document.getElementById('diet-label').textContent = organism.dietLabel;

            // 추가 정보가 있는 생물만 '더 알아보기' 칸 보이기
            const extraBox = document.getElementById('extra-box');
            if (organism.extra) {
                fillSentences('modal-extra', organism.extra);
                extraBox.classList.remove('hidden');
            } else {
                extraBox.classList.add('hidden');
            }
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 모달이 뜰 때는 마우스 커서를 기본으로 돌리고 돋보기는 숨김
            customCursor.style.display = 'none';
            document.body.style.cursor = 'default';
        }

        // 모달 닫기
        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        
        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            
            // 모달을 닫았을 때, 발견한 생물 처리
            if (currentOpenOrganismId !== null) {
                // 반짝이 숨기기 (더 이상 안 보이게)
                const sparkle = document.getElementById(`sparkle-${currentOpenOrganismId}`);
                if(sparkle) sparkle.style.display = 'none';
                
                // 클릭 영역 비활성화 방지(원한다면 다시 눌러서 볼 수 있게 둠. 방지하려면 클릭이벤트 제거)

                // 이모지를 돋보기 밖 배경에 영구적으로 표시 (팝업 애니메이션 효과)
                const foundEmoji = document.getElementById(`found-emoji-${currentOpenOrganismId}`);
                if(foundEmoji) foundEmoji.classList.add('show');
                
                currentOpenOrganismId = null;
            }

            // 돋보기 다시 활성화
            customCursor.style.display = 'block';
            document.body.style.cursor = 'none';
            
            // 만약 모바일 등에서 터치 후 닫았다면 커서가 화면 가운데쯤 오도록 초기화 방지 
            // (터치 환경에서는 다음 터치때 이동함)
        }
    </script>
</body>
</html>
